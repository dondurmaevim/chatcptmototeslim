<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mototeslim</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
margin-top:100px;
}

.box{
display:inline-block;
width:200px;
padding:30px;
margin:20px;
background:white;
border-radius:10px;
cursor:pointer;
font-size:20px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.menu{
display:none;
margin-top:40px;
}

button{
padding:10px 20px;
margin:10px;
font-size:16px;
}

.form{
display:none;
margin-top:30px;
}

input{
display:block;
margin:10px auto;
padding:10px;
width:200px;
}

</style>

</head>

<body>

<h1>MOTOTESLİM</h1>

<div class="box" onclick="showMenu('customer')">
📦 Paket Gönder
</div>

<div class="box" onclick="showMenu('courier')">
🏍 Kurye Ol
</div>

<div id="menu" class="menu">

<button onclick="showForm('login')">Giriş Yap</button>

<button onclick="showForm('register')">Kayıt Ol</button>

<button onclick="showForm('forgot')">Şifremi Unuttum</button>

</div>

<div id="login" class="form">

<h3>Giriş Yap</h3>

<input placeholder="Telefon">

<input type="password" placeholder="Şifre">

<button>Giriş</button>

</div>

<div id="register" class="form">

<h3>Kayıt Ol</h3>

<input placeholder="Ad Soyad">

<input placeholder="Telefon">

<input placeholder="Adres">

<input type="password" placeholder="Şifre">

<button>Kayıt Ol</button>

</div>

<div id="forgot" class="form">

<h3>Şifre Yenile</h3>

<input placeholder="Telefon">

<button>Şifre Gönder</button>

</div>

<script>

function showMenu(type){

document.getElementById("menu").style.display="block"

}

function showForm(type){

document.getElementById("login").style.display="none"
document.getElementById("register").style.display="none"
document.getElementById("forgot").style.display="none"

document.getElementById(type).style.display="block"

}

</script>

</body>
</html>
